# Optional local pre-commit hooks. CI is the enforced gate.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: \.sh$

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-2
    hooks:
      - id: shfmt
        args: ['-w', '-i', '2', '-ci']
        files: \.sh$

  - repo: local
    hooks:
      - id: sync-agent-docs
        name: Sync agent docs
        entry: npm run sync:agent-docs
        language: system
        files: ^(AGENTS|CLAUDE)\.md$
        pass_filenames: false

      - id: npm-lint
        name: npm lint
        entry: npm run lint
        language: system
        pass_filenames: false

      - id: npm-format-check
        name: npm format check
        entry: npm run format:check
        language: system
        pass_filenames: false

      - id: trivy-fs
        name: Trivy filesystem scan
        entry: python .githooks/trivy-precommit.py
        language: python
        pass_filenames: false
